<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Truth - The Legend of Hanuman</title>
    
    <meta property="og:title" content="The Truth: A Hanuman AR Experience">
    <meta property="og:description" content="Walk into the legend. A bilingual immersive journey into the Ramayana using WebAR. Designed by Raghav Sharma.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            color: #FFD700;
            text-align: center;
            background-image: radial-gradient(circle at center, #1a1500 0%, #000000 70%);
            overflow: hidden; /* Prevent scrolling during intro */
        }

        /* --- CINEMATIC INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease-out;
        }

        #intro-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; /* Keeps the ratio, adds black bars */
            background: #000; 
            opacity: 0; 
            transition: opacity 0.8s;
        }

        #intro-content {
            position: relative;
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s;
        }

        .intro-title {
            font-size: 3rem;
            letter-spacing: 5px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: glow 3s infinite alternate;
        }

        #enter-experience-btn {
            padding: 15px 40px;
            background: transparent;
            border: 1px solid #FFD700;
            color: #FFD700;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        #enter-experience-btn:hover {
            background: #FFD700;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        .fade-out { opacity: 0; pointer-events: none; }

        /* --- MAIN SITE STYLES --- */
        h1 { font-size: 3rem; margin-bottom: 10px; letter-spacing: 5px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        p { margin-bottom: 50px; color: #aaa; letter-spacing: 2px; }
        
        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; transition: opacity 0.5s; }
        .hidden { display: none !important; opacity: 0; }
        
        .choice-btn {
            padding: 20px 50px;
            border: 1px solid #FFD700;
            background: rgba(255, 215, 0, 0.05);
            color: #FFD700;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.4s;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 200px;
            border-radius: 5px;
            text-decoration: none;
        }
        
        .choice-btn:hover {
            background: #FFD700;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            transform: translateY(-5px);
        }

        .hindi-font { font-family: 'Rozha One', serif; }
        .btn-sub { font-size: 0.8rem; margin-top: 10px; opacity: 0.7; font-family: sans-serif; letter-spacing: 1px; }

        .docs-link {
            margin-top: 60px;
            color: rgba(255, 215, 0, 0.5);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        .docs-link:hover { color: #FFD700; border-bottom: 1px solid #FFD700; }

        .creator-credit {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: rgba(255, 215, 0, 0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 100;
        }

        .creator-credit .highlight {
            color: #FFD700;
            font-weight: 700;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        #mobile-hint {
            color: #FFD700;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            margin-top: 30px;
            letter-spacing: 1px;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            animation: pulse 3s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #FFD700; }
            to { text-shadow: 0 0 30px #FFD700, 0 0 10px white; }
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <video id="intro-video" playsinline>
            <source src="assets/videos/intro.mp4" type="video/mp4">
        </video>
        
        <div id="intro-content">
            <h1 class="intro-title">THE TRUTH</h1>
            <button id="enter-experience-btn">ENTER THE LEGEND</button>
        </div>
    </div>


    <h1>THE TRUTH</h1>
    <p id="instruction-text">Choose your language / अपनी भाषा चुनें</p>

    <div id="lang-selection" class="container">
        <div class="choice-btn" onclick="selectLanguage('en')">
            ENGLISH
            <span class="btn-sub">The Legend</span>
        </div>

        <div class="choice-btn hindi-font" onclick="selectLanguage('hi')">
            हिंदी
            <span class="btn-sub">गाथा</span>
        </div>
    </div>

    <p id="mobile-hint" class="hidden">
        For an immersive AR walkthrough, open this site on your mobile.
    </p>

    <div id="mode-selection" class="container hidden">
        <div class="choice-btn" onclick="goToMode('web')">
            SCROLL MODE
            <span class="btn-sub">Relax & Read</span>
        </div>

        <div class="choice-btn" onclick="goToMode('ar')">
            AR MODE
            <span class="btn-sub">Walk Inside</span>
        </div>

        <div class="choice-btn" onclick="goToMode('vr')">
            VR MODE
            <span class="btn-sub">Use Headset</span>
        </div>
    </div>

    <a href="https://rexhav.github.io/TheTruthDocumentation/" target="_blank" class="docs-link">
        VIEW PROJECT ARCHITECTURE
    </a>

    <div class="creator-credit">
        Designed & Built by <span class="highlight">RAGHAV SHARMA</span>
    </div>

    <script>
        // --- 🎬 INTRO LOGIC ---
        const introOverlay = document.getElementById('intro-overlay');
        const introVideo = document.getElementById('intro-video');
        const enterBtn = document.getElementById('enter-experience-btn');
        const introContent = document.getElementById('intro-content');

        enterBtn.addEventListener('click', () => {
            introContent.style.opacity = '0'; // Hide button
            introVideo.style.opacity = '1';   // Show video player
            introVideo.play();                // Play with sound
        });

        introVideo.addEventListener('ended', () => {
            introOverlay.classList.add('fade-out'); // Fade overlay
            setTimeout(() => {
                introOverlay.style.display = 'none'; // Remove from layout
            }, 1500);
        });

        // --- EXISTING LOGIC ---
        let selectedLang = 'en'; 

        const isMobile = /iPhone|Android|iPad/i.test(navigator.userAgent);
        
        if (!isMobile) {
            document.getElementById('mobile-hint').classList.remove('hidden');
        }

        function selectLanguage(lang) {
            selectedLang = lang;
            
            if (isMobile) {
                document.getElementById('lang-selection').classList.add('hidden');
                document.getElementById('mode-selection').classList.remove('hidden');
                
                const instruction = document.getElementById('instruction-text');
                instruction.innerText = lang === 'hi' 
                    ? "अनुभव चुनें (Choose Mode)" 
                    : "Choose Experience Mode";
                    
            } else {
                goToMode('web');
            }
        }

        function goToMode(mode) {
            console.log(`Going to ${mode} in ${selectedLang}`);
            window.location.href = `${mode}.html?lang=${selectedLang}`;
        }
    </script>

</body>
</html>
