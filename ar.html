<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hanuman AR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Cinzel', serif; }
        
        /* Subtitles */
        #subtitle-container {
            position: absolute; bottom: 15%; width: 90%; left: 5%;
            text-align: center; pointer-events: none; z-index: 10;
        }
        
        #subtitle-text {
            color: #FFD700; font-size: 1.2rem;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.4); 
            padding: 15px; border-radius: 10px;
            opacity: 0; transition: opacity 0.5s ease;
            text-rendering: optimizeLegibility;
        }
        #subtitle-text.visible { opacity: 1; }

        /* WARNING (Initial Screen) - Updated for Walking Emphasis */
        #ar-warning {
            position: absolute; top: 20%; width: 100%; text-align: center;
            color: #FFD700; z-index: 20; pointer-events: none;
            padding: 0 20px; box-sizing: border-box;
        }
        #ar-warning h2 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px #FFD700; }
        #ar-warning p { 
            font-family: sans-serif; font-size: 1rem; color: #fff; opacity: 0.9; line-height: 1.6; margin-top: 15px;
            text-shadow: 0 0 5px #000;
        }
        .highlight { color: #FFD700; font-weight: bold; border-bottom: 1px solid #FFD700; }

        /* GESTURE GUIDE HUD */
        #gesture-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 15px;
            z-index: 50;
            pointer-events: none;
            opacity: 0; /* Hidden initially */
            transition: opacity 1s ease;
            width: 90%;
            justify-content: center;
        }

        .guide-card {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            backdrop-filter: blur(5px);
            width: 140px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        /* Vector Icon Styling */
        .guide-icon svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #FFD700;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 5px rgba(255,215,0,0.5));
        }

        .guide-title { color: #FFD700; font-size: 0.9rem; margin-bottom: 5px; letter-spacing: 1px; }
        .guide-desc { color: #aaa; font-family: sans-serif; font-size: 0.7rem; line-height: 1.2; }

    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <audio id="ar-bg-music" loop>
        <source src="assets/audio/bgmusic.mp3" type="audio/mpeg">
    </audio>

    <div id="ar-warning">
        <h2>Walk Into The Legend</h2>
        <p>This is a physical journey.<br>
        Please <span class="highlight">walk forward</span> to explore the story.</p>
        <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 20px;">(Use gestures only if you hit a wall)</p>
    </div>

    <div id="gesture-guide">
        <div class="guide-card">
            <div class="guide-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2a10 10 0 1 0 10 10"></path>
                    <path d="M8 12l4 4 4-4"></path> <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2" stroke-opacity="0.2"></path>
                    <path d="M14 10l-2 9" stroke-width="1.5"></path> </svg>
            </div>
            <div class="guide-title">BLOCKED?</div>
            <div class="guide-desc">Drag 1 finger to rotate the path away from walls.</div>
        </div>

        <div class="guide-card">
            <div class="guide-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M21 21l-6-6"></path>
                    <path d="M3 3l6 6"></path>
                    <path d="M9 9l-2 2"></path>
                    <path d="M15 15l2-2"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
            <div class="guide-title">TOO FAR?</div>
            <div class="guide-desc">Pinch with 2 fingers to bring panels closer.</div>
        </div>
    </div>

    <div id="subtitle-container">
        <div id="subtitle-text"></div>
    </div>

    <script type="module" src="script-ar-v3.js?v=999"></script>
</body>
</html>
