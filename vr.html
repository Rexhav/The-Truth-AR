<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Truth - VR Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Cinzel', serif; }
        
        /* OVERLAY */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            text-align: center; color: #FFD700;
        }
        
        button {
            padding: 15px 30px; font-size: 1.2rem; background: #FFD700; color: #000;
            border: none; border-radius: 5px; margin-top: 20px; font-family: 'Cinzel', serif;
            cursor: pointer; transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); background: #fff; }
        
        /* DEBUG CONSOLE (To see errors on phone) */
        #debug-console {
            position: absolute; top: 0; left: 0; width: 100%; 
            color: #ff4444; font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.8); pointer-events: none; z-index: 200;
            padding: 10px; box-sizing: border-box; text-align: left;
            white-space: pre-wrap;
        }

        #home-btn {
            position: absolute; top: 20px; left: 20px; z-index: 50;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 50%;
            border: 1px solid #FFD700; display: flex;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="debug-console"></div>

    <a href="index.html" id="home-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFD700" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    </a>

    <div id="overlay">
        <h1>ENTER THE VOID</h1>
        <p>Put your phone in a VR Headset</p>
        <button id="start-btn">START VR</button>
        <p id="status-text" style="font-size: 0.8rem; color: #666; margin-top: 20px;">Initializing...</p>
    </div>

    <audio id="bg-music" loop><source src="assets/audio/bgmusic.mp3" type="audio/mpeg"></audio>

    <script>
        // --- ERROR TRAP ---
        // This catches errors and prints them to the screen so you can see them!
        window.onerror = function(msg, url, line) {
            const log = document.getElementById('debug-console');
            log.innerHTML += `❌ ERROR: ${msg}\nLine: ${line}\n`;
            document.getElementById('status-text').innerText = "System Error. Check top left.";
            document.getElementById('status-text').style.color = "red";
            return false;
        };
        
        function log(msg) {
            console.log(msg);
            // Uncomment next line to see ALL logs on screen (spammy)
            // document.getElementById('debug-console').innerHTML += `ℹ️ ${msg}\n`;
        }
    </script>

    <script type="module">
        log("Module script started...");
        
        import * as THREE from 'three';
        import { DeviceOrientationControls } from 'three/addons/controls/DeviceOrientationControls.js';

        // If we got here, imports worked!
        document.getElementById('status-text').innerText = "System Ready. Press Start.";
        document.getElementById('status-text').style.color = "#0f0";

        // SETUP
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'en';
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const light = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
        scene.add(light);

        let controls = null;

        // --- LOAD CONTENT ---
        const textureLoader = new THREE.TextureLoader();
        const PANEL_DISTANCE = 1.5;

        function createPanel(index, zPos) {
            const group = new THREE.Group();
            group.position.set(0, 0, -zPos);
            
            const layers = [
                { suffix: '_bg.png', z: -0.3, scale: 1.5 },
                { suffix: '_mid.png', z: -0.1, scale: 1.2 },
                { suffix: '_fg.png', z: 0.1, scale: 1.0 }
            ];

            layers.forEach(layer => {
                const path = `assets/panels/panel${index}${layer.suffix}`;
                textureLoader.load(path, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    const aspect = tex.image.width / tex.image.height;
                    const mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(aspect, 1),
                        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
                    );
                    mesh.position.z = layer.z;
                    mesh.scale.set(layer.scale, layer.scale, 1);
                    group.add(mesh);
                }, undefined, (err) => {
                    log(`Error loading texture: ${path}`);
                });
            });
            worldGroup.add(group);
        }

        for(let i=1; i<=11; i++) createPanel(i, i * PANEL_DISTANCE);

        // --- BUTTON LOGIC ---
        const startBtn = document.getElementById('start-btn');
        
        startBtn.addEventListener('click', async () => {
            log("Start button clicked...");
            startBtn.innerText = "Loading...";
            
            try {
                // 1. Audio
                const music = document.getElementById('bg-music');
                if(music) music.play().catch(e => log("Audio play warning: " + e));

                // 2. Hide Overlay
                document.getElementById('overlay').style.display = 'none';

                // 3. Init Controls
                controls = new DeviceOrientationControls(camera);
                
                // 4. iOS Permission
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    log("Requesting iOS permission...");
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        controls.connect();
                        log("iOS Permission Granted");
                    } else {
                        alert("Permission denied. You cannot look around in VR.");
                    }
                } else {
                    controls.connect();
                    log("Controls connected (Android/Desktop)");
                }

            } catch(e) {
                alert("Critical VR Error: " + e.message);
                document.getElementById('debug-console').innerHTML += `❌ CRASH: ${e.message}`;
            }
        });

        // --- RENDER LOOP ---
        const eyeSep = 0.06;
        
        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();

            // Auto-move forward slowly
            worldGroup.position.z += 0.002; 

            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);

            // Left
            renderer.setScissor(0, 0, w/2, h);
            renderer.setViewport(0, 0, w/2, h);
            camera.position.x = -eyeSep/2;
            renderer.render(scene, camera);

            // Right
            renderer.setScissor(w/2, 0, w/2, h);
            renderer.setViewport(w/2, 0, w/2, h);
            camera.position.x = eyeSep/2;
            renderer.render(scene, camera);
        }
        animate();
        log("Render loop started.");
    </script>
</body>
</html>
