<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Truth - Cardboard AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Cinzel', serif; }
        
        /* THE CAMERA FEED (Background) */
        #camera-feed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; transform: scaleX(-1); /* Mirror fix if needed */
        }

        /* OVERLAY */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            text-align: center; color: #FFD700;
        }
        
        button {
            padding: 15px 30px; font-size: 1.2rem; background: #FFD700; color: #000;
            border: none; border-radius: 5px; margin-top: 20px; font-family: 'Cinzel', serif;
            cursor: pointer;
        }

        /* LANDSCAPE WARNING */
        #landscape-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; color: #FFD700;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #landscape-alert svg { width: 60px; height: 60px; fill: #FFD700; animation: rotate 2s infinite; }
        
        /* SUBTITLES (Duplicated for Left/Right Eye) */
        .subtitle-eye {
            position: absolute; bottom: 20%; width: 45%; text-align: center; pointer-events: none; z-index: 10;
        }
        .sub-left { left: 2.5%; }
        .sub-right { left: 52.5%; }
        
        .sub-text {
            color: #FFD700; font-size: 1rem; background: rgba(0,0,0,0.6); 
            padding: 10px; border-radius: 10px; opacity: 0; transition: opacity 0.5s;
            display: inline-block;
        }
        .sub-text.visible { opacity: 1; }

        @media (orientation: portrait) {
            #landscape-alert { display: flex; }
        }
        @keyframes rotate { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
    </style>
</head>
<body>

    <div id="landscape-alert">
        <svg viewBox="0 0 24 24"><path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3.25-3H6.75V4h10.5v14z"/></svg>
        <p style="margin-top:20px;">PLEASE ROTATE YOUR PHONE</p>
    </div>

    <video id="camera-feed" autoplay playsinline muted></video>

    <div id="overlay">
        <h1>CARDBOARD AR</h1>
        <p>1. Allow Camera Access<br>2. Rotate Phone<br>3. Put in Headset</p>
        <button id="start-btn">START EXPERIENCE</button>
        <p id="status" style="font-size:0.8rem; color:#888; margin-top:10px;">Waiting...</p>
    </div>

    <div class="subtitle-eye sub-left"><div class="sub-text" id="sub-L"></div></div>
    <div class="subtitle-eye sub-right"><div class="sub-text" id="sub-R"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function(){const _zee=new THREE.Vector3(0,0,1),_euler=new THREE.Euler,_q0=new THREE.Quaternion,_q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));class DeviceOrientationControls{constructor(e){this.object=e,this.object.rotation.reorder("YXZ"),this.enabled=!0,this.deviceOrientation={},this.screenOrientation=0,this.alphaOffset=0,this.connect()}connect(){this.onScreenOrientationChangeEvent=()=>{this.screenOrientation=window.orientation||0},this.onDeviceOrientationChangeEvent=e=>{this.deviceOrientation=e},this.screenOrientation=window.orientation||0,window.addEventListener("orientationchange",this.onScreenOrientationChangeEvent),window.addEventListener("deviceorientation",this.onDeviceOrientationChangeEvent),this.enabled=!0}disconnect(){window.removeEventListener("orientationchange",this.onScreenOrientationChangeEvent),window.removeEventListener("deviceorientation",this.onDeviceOrientationChangeEvent),this.enabled=!1}update(){if(!1===this.enabled)return;const e=this.deviceOrientation;if(e){const t=e.alpha?THREE.MathUtils.degToRad(e.alpha)+this.alphaOffset:0,n=e.beta?THREE.MathUtils.degToRad(e.beta):0,o=e.gamma?THREE.MathUtils.degToRad(e.gamma):0,i=this.screenOrientation?THREE.MathUtils.degToRad(this.screenOrientation):0;this.setObjectQuaternion(this.object.quaternion,t,n,o,i)}}setObjectQuaternion(e,t,n,o,i){_euler.set(n,t,-o,"YXZ"),e.setFromEuler(_euler),e.multiply(_q1),e.multiply(_q0.setFromAxisAngle(_zee,-i))}}THREE.DeviceOrientationControls=DeviceOrientationControls;})();
    </script>

    <script>
        // CONFIG
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'en';
        
        // --- STORY DATA ---
        const STORY_DATA = {
            1: { en: "After the defeat of Ravana, Ram Rajya blossomed...", hi: "रावण वध के बाद, पृथ्वी पर राम राज्य खिल उठा..." },
            2: { en: "Hanuman stands guard over Ram...", hi: "हनुमान राम के चारों ओर एक अभेद्य किले..." },
            3: { en: "Rama understood the silence behind the heavens...", hi: "राम स्वर्ग के पीछे का मौन समझ गए..." },
            4: { en: "Ram let His ring fall into the depths...", hi: "राम ने अपनी अंगूठी पाताल की गहराइयों में गिरा दी..." },
            6: { en: "With folded hands, Hanuman bowed.", hi: "जुड़े हुए हाथों से हनुमान नतमस्तक हुए।" },
            7: { en: "Vasuki: What do you seek in Naag Lok?", hi: "वासुकी: नाग लोक में क्या खोज रहे हो?" },
            8: { en: "These rings are echoes of time itself.", hi: "ये अंगूठियां समय की प्रतिध्वनि हैं।" },
            9: { en: "Every age repeats. Every story returns.", hi: "हर युग दोहराता है। हर कहानी लौटती है।" },
            10: { en: "He saw himself across countless lives.", hi: "उन्होंने अपने आप को अनगिनत जन्मों में देखा।" },
            11: { en: "Ram never left Hanuman's heart.", hi: "राम हनुमान के हृदय से कभी नहीं गए।" }
        };

        // SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // Alpha true for Camera feed
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Transparent background
        document.body.appendChild(renderer.domElement);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1));

        // --- AUDIO ---
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const audioLoader = new THREE.AudioLoader();
        const panelAudios = {}; 
        const audioPanels = [1,2,3,4,6,7,8,9,10,11];

        audioPanels.forEach(i => {
            const sound = new THREE.Audio(listener);
            audioLoader.load(`assets/audio/panel${i}_${currentLang}.mp3`, (buffer) => {
                sound.setBuffer(buffer);
                panelAudios[i] = sound;
            });
        });

        // --- PANELS ---
        const textureLoader = new THREE.TextureLoader();
        const panelPositions = []; 
        const PANEL_DISTANCE = 1.5;

        function createPanel(index, zPos) {
            const group = new THREE.Group();
            group.position.set(0, 0, -zPos); 
            
            ['_bg.png', '_mid.png', '_fg.png'].forEach((suffix, i) => {
                const zOffsets = [-0.3, -0.1, 0.1];
                const scales = [1.5, 1.2, 1.0];
                textureLoader.load(`assets/panels/panel${index}${suffix}`, (tex) => {
                    tex.encoding = THREE.sRGBEncoding;
                    const aspect = tex.image.width / tex.image.height;
                    const mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(aspect, 1),
                        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
                    );
                    mesh.position.z = zOffsets[i];
                    mesh.scale.set(scales[i], scales[i], 1);
                    group.add(mesh);
                });
            });
            worldGroup.add(group);
            panelPositions.push({ id: index, z: -zPos });
        }
        for(let i=1; i<=11; i++) createPanel(i, i * PANEL_DISTANCE);

        // --- CAMERA FEED LOGIC ---
        async function startCamera() {
            try {
                const video = document.getElementById('camera-feed');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera Access Denied. You will see a black background.");
            }
        }

        // --- START ---
        let controls = null;
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('overlay').style.display = 'none';
            
            // 1. Start Camera
            startCamera();

            // 2. Init VR Controls
            controls = new THREE.DeviceOrientationControls(camera);
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
            }
        });

        // --- AUDIO LOGIC ---
        let currentActivePanel = -1;
        const subL = document.getElementById('sub-L');
        const subR = document.getElementById('sub-R');

        function checkProximity() {
            // In "Auto-Walk" VR, the world moves, camera stays at 0,0,0
            // So we check distance from 0,0,0 to panel world position
            const camPos = new THREE.Vector3(0,0,0); 
            let closestPanel = -1;
            let closestDist = 9999;

            panelPositions.forEach(p => {
                const panelWorldPos = new THREE.Vector3(0, 0, p.z);
                panelWorldPos.applyMatrix4(worldGroup.matrixWorld);
                const dist = camPos.distanceTo(panelWorldPos);
                
                if (dist < 1.5) { // Activation distance
                    if (dist < closestDist) { closestDist = dist; closestPanel = p.id; }
                }
            });

            if (closestPanel !== -1 && closestPanel !== currentActivePanel) {
                // Stop old
                if (currentActivePanel !== -1 && panelAudios[currentActivePanel]?.isPlaying) {
                    panelAudios[currentActivePanel].stop();
                }
                // Play new
                if (panelAudios[closestPanel]) panelAudios[closestPanel].play();

                // Show Subtitles (Both Eyes)
                const txt = STORY_DATA[closestPanel] ? STORY_DATA[closestPanel][currentLang] : "";
                if (txt) {
                    subL.innerText = txt; subR.innerText = txt;
                    subL.classList.add('visible'); subR.classList.add('visible');
                    // Font fix
                    const font = currentLang === 'hi' ? "'Rozha One', serif" : "'Cinzel', serif";
                    subL.style.fontFamily = font; subR.style.fontFamily = font;
                } else {
                    subL.classList.remove('visible'); subR.classList.remove('visible');
                }
                currentActivePanel = closestPanel;
            }
        }

        // --- LOOP ---
        const eyeSep = 0.06;
        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();

            // 🔥 AUTO-WALK (The panels move towards you)
            worldGroup.position.z += 0.002; 

            // Check Audio
            checkProximity();

            // RENDER SPLIT
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);

            // Left
            renderer.setScissor(0, 0, w/2, h);
            renderer.setViewport(0, 0, w/2, h);
            camera.position.x = -eyeSep/2;
            renderer.render(scene, camera);

            // Right
            renderer.setScissor(w/2, 0, w/2, h);
            renderer.setViewport(w/2, 0, w/2, h);
            camera.position.x = eyeSep/2;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
