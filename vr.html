<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Truth - Cardboard AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Cinzel', serif; }
        
        /* OVERLAY */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            text-align: center; color: #FFD700;
        }
        
        button {
            padding: 15px 30px; font-size: 1.2rem; background: #FFD700; color: #000;
            border: none; border-radius: 5px; margin-top: 20px; font-family: 'Cinzel', serif;
            cursor: pointer;
        }

        /* RETICLE (Cursors) */
        .reticle {
            position: absolute; top: 50%; width: 20px; height: 20px;
            border: 2px solid #FFF; border-radius: 50%; z-index: 50;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 10px white; transition: transform 0.2s, background 0.2s;
        }
        .reticle.active { background: #FFD700; transform: translate(-50%, -50%) scale(0.5); }
        
        /* Split Screen Positions */
        #reticle-left { left: 25%; } 
        #reticle-right { left: 75%; }
        
        /* LANDSCAPE WARNING */
        #landscape-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; color: #FFD700;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #landscape-alert svg { width: 60px; height: 60px; fill: #FFD700; animation: rotate 2s infinite; }
        @media (orientation: portrait) { #landscape-alert { display: flex; } }
        @keyframes rotate { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
    </style>
</head>
<body>

    <video id="video-source" playsinline webkit-playsinline muted style="display:none"></video>

    <div id="landscape-alert">
        <svg viewBox="0 0 24 24"><path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3.25-3H6.75V4h10.5v14z"/></svg>
        <p style="margin-top:20px;">PLEASE ROTATE PHONE</p>
    </div>

    <div id="overlay">
        <h1>CARDBOARD AR</h1>
        <p>1. Allow Camera<br>2. Rotate Phone<br>3. Look down to move</p>
        <button id="start-btn">START EXPERIENCE</button>
    </div>

    <div id="reticle-left" class="reticle"></div>
    <div id="reticle-right" class="reticle"></div>

    <audio id="bg-music" loop><source src="assets/audio/bgmusic.mp3" type="audio/mpeg"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function(){const _zee=new THREE.Vector3(0,0,1),_euler=new THREE.Euler,_q0=new THREE.Quaternion,_q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));class DeviceOrientationControls{constructor(e){this.object=e,this.object.rotation.reorder("YXZ"),this.enabled=!0,this.deviceOrientation={},this.screenOrientation=0,this.alphaOffset=0,this.connect()}connect(){this.onScreenOrientationChangeEvent=()=>{this.screenOrientation=window.orientation||0},this.onDeviceOrientationChangeEvent=e=>{this.deviceOrientation=e},this.screenOrientation=window.orientation||0,window.addEventListener("orientationchange",this.onScreenOrientationChangeEvent),window.addEventListener("deviceorientation",this.onDeviceOrientationChangeEvent),this.enabled=!0}disconnect(){window.removeEventListener("orientationchange",this.onScreenOrientationChangeEvent),window.removeEventListener("deviceorientation",this.onDeviceOrientationChangeEvent),this.enabled=!1}update(){if(!1===this.enabled)return;const e=this.deviceOrientation;if(e){const t=e.alpha?THREE.MathUtils.degToRad(e.alpha)+this.alphaOffset:0,n=e.beta?THREE.MathUtils.degToRad(e.beta):0,o=e.gamma?THREE.MathUtils.degToRad(e.gamma):0,i=this.screenOrientation?THREE.MathUtils.degToRad(this.screenOrientation):0;this.setObjectQuaternion(this.object.quaternion,t,n,o,i)}}setObjectQuaternion(e,t,n,o,i){_euler.set(n,t,-o,"YXZ"),e.setFromEuler(_euler),e.multiply(_q1),e.multiply(_q0.setFromAxisAngle(_zee,-i))}}THREE.DeviceOrientationControls=DeviceOrientationControls;})();
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'en';
        
        // SETUP
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 500);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // 🔥 SHARP TEXT FIX
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        // --- 🎥 CAMERA BACKGROUND (THE SKYBOX FIX) ---
        const video = document.getElementById('video-source');
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        
        // GIANT SPHERE instead of plane = Full Surround Vision
        const camGeo = new THREE.SphereGeometry(200, 60, 40); 
        // Invert sphere so we see the inside
        camGeo.scale(-1, 1, 1); 
        const camMat = new THREE.MeshBasicMaterial({ map: videoTexture });
        const camMesh = new THREE.Mesh(camGeo, camMat);
        
        // Attach to camera so it follows you everywhere
        camera.add(camMesh);
        scene.add(camera);

        // --- 3D PANELS ---
        const textureLoader = new THREE.TextureLoader();
        const panelPositions = []; 
        const PANEL_DISTANCE = 1.5;

        function createPanel(index, zPos) {
            const group = new THREE.Group();
            group.position.set(0, 0, -zPos); 
            
            ['_bg.png', '_mid.png', '_fg.png'].forEach((suffix, i) => {
                const zOffsets = [-0.3, -0.1, 0.1];
                const scales = [1.5, 1.2, 1.0];
                const path = `assets/panels/panel${index}${suffix}`;

                textureLoader.load(path, (tex) => {
                    tex.encoding = THREE.sRGBEncoding;
                    const aspect = tex.image.width / tex.image.height;
                    const mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(aspect, 1),
                        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
                    );
                    mesh.position.z = zOffsets[i];
                    mesh.scale.set(scales[i], scales[i], 1);
                    group.add(mesh);
                });
            });
            worldGroup.add(group);
            panelPositions.push({ id: index, z: -zPos });
        }
        for(let i=1; i<=11; i++) createPanel(i, i * PANEL_DISTANCE);

        // --- 🔘 HIGH RES CONTROLS ---
        const buttonGroup = new THREE.Group();
        scene.add(buttonGroup); // 🔥 DETACHED FROM CAMERA (Allows you to look at them)

        function createButton(name, x, color) {
            // High Res Canvas
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256; // 🔥 4X RESOLUTION
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = color;
            ctx.fillRect(0,0,512,256);
            ctx.fillStyle = "black";
            ctx.font = "bold 80px Arial"; // Bigger Font
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(name, 256, 128);
            
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex });
            const geo = new THREE.PlaneGeometry(0.6, 0.3);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.x = x;
            mesh.userData = { type: name };
            buttonGroup.add(mesh);
            return mesh;
        }

        createButton("PREV", -0.8, "#FFD700");
        createButton("RESET", 0, "#FF4444");
        createButton("NEXT", 0.8, "#00FF00");

        // --- RAYCASTER ---
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);
        let lookTimer = 0;
        let activeBtn = null;
        
        function updateGaze(dt) {
            // Update buttons to follow camera position (but NOT rotation)
            // This keeps them at your "chest" level
            buttonGroup.position.z = camera.position.z - 2; 
            buttonGroup.position.y = -1.2; // Look down
            buttonGroup.position.x = camera.position.x; // Stay centered

            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(buttonGroup.children);

            const retL = document.getElementById('reticle-left');
            const retR = document.getElementById('reticle-right');

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                retL.classList.add('active'); retR.classList.add('active');

                if (activeBtn !== hit) {
                    activeBtn = hit;
                    lookTimer = 0;
                } else {
                    lookTimer += dt;
                    if (hit.userData.type === "NEXT") {
                        worldGroup.position.z += 0.03; 
                    } else if (hit.userData.type === "PREV") {
                        worldGroup.position.z -= 0.03;
                    } else if (hit.userData.type === "RESET") {
                        if (lookTimer > 1.0) { worldGroup.position.z = 0; lookTimer = 0; }
                    }
                }
            } else {
                retL.classList.remove('active'); retR.classList.remove('active');
                activeBtn = null; lookTimer = 0;
            }
        }

        // --- AUDIO & START ---
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const audioLoader = new THREE.AudioLoader();
        const panelAudios = {}; 
        const audioPanels = [1,2,3,4,6,7,8,9,10,11];

        audioPanels.forEach(i => {
            const sound = new THREE.Audio(listener);
            audioLoader.load(`assets/audio/panel${i}_${currentLang}.mp3`, (buffer) => {
                sound.setBuffer(buffer);
                panelAudios[i] = sound;
            });
        });

        let controls = null;
        document.getElementById('start-btn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720} } 
                });
                video.srcObject = stream;
                video.play();
            } catch (e) { console.log("Camera failed"); }

            const music = document.getElementById('bg-music');
            if(music) music.play();
            document.getElementById('overlay').style.display = 'none';

            controls = new THREE.DeviceOrientationControls(camera);
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
            }
        });

        let currentActivePanel = -1;
        function checkProximity() {
            const camPos = new THREE.Vector3(0,0,0);
            let closestPanel = -1;
            let closestDist = 9999;

            panelPositions.forEach(p => {
                const panelWorldPos = new THREE.Vector3(0, 0, p.z);
                panelWorldPos.applyMatrix4(worldGroup.matrixWorld);
                const dist = camPos.distanceTo(panelWorldPos);
                if (dist < 1.5) { 
                    if (dist < closestDist) { closestDist = dist; closestPanel = p.id; }
                }
            });

            if (closestPanel !== -1 && closestPanel !== currentActivePanel) {
                if (currentActivePanel !== -1 && panelAudios[currentActivePanel]?.isPlaying) {
                    panelAudios[currentActivePanel].stop();
                }
                if (panelAudios[closestPanel]) panelAudios[closestPanel].play();
                currentActivePanel = closestPanel;
            }
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        const eyeSep = 0.06;

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if(controls) controls.update();

            updateGaze(dt);
            checkProximity();

            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);

            // Left
            renderer.setScissor(0, 0, w/2, h);
            renderer.setViewport(0, 0, w/2, h);
            camera.position.x = -eyeSep/2;
            renderer.render(scene, camera);

            // Right
            renderer.setScissor(w/2, 0, w/2, h);
            renderer.setViewport(w/2, 0, w/2, h);
            camera.position.x = eyeSep/2;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
