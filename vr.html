<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Truth - Cinematic VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Cinzel', serif; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            text-align: center; color: #FFD700; padding: 20px;
        }
        
        button {
            padding: 15px 40px; font-size: 1.2rem; background: transparent; 
            color: #FFD700; border: 2px solid #FFD700; border-radius: 50px; 
            font-family: 'Cinzel', serif; cursor: pointer; transition: all 0.3s;
        }
        button:hover { background: #FFD700; color: #000; box-shadow: 0 0 20px #FFD700; }
        button:disabled { opacity: 0.5; border-color: #555; color: #555; }

        /* CURSORS */
        .reticle {
            position: absolute; top: 50%; width: 12px; height: 12px;
            border: 2px solid #FFF; border-radius: 50%; z-index: 50;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 5px white;
        }
        .reticle.active { 
            background: #FFD700; border-color: #FFD700;
            transform: translate(-50%, -50%) scale(2.0); 
            transition: transform 1.5s linear; 
        }
        .reticle.clicked { transform: translate(-50%, -50%) scale(1.0); transition: 0.1s; }
        
        #reticle-left { left: 25%; } 
        #reticle-right { left: 75%; }
        
        #landscape-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; color: #FFD700;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #landscape-alert svg { width: 60px; height: 60px; fill: #FFD700; animation: rotate 2s infinite; }
        @media (orientation: portrait) { #landscape-alert { display: flex; } }
        @keyframes rotate { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
    </style>
</head>
<body>

    <div id="landscape-alert">
        <svg viewBox="0 0 24 24"><path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3.25-3H6.75V4h10.5v14z"/></svg>
        <p style="margin-top:20px;">PLEASE ROTATE PHONE</p>
    </div>

    <div id="overlay">
        <h1>VR CINEMA MODE</h1>
        <p style="color:#ccc; line-height:1.6;">
            1. Press the button below.<br>
            2. <strong>Wait 10s</strong> to put phone in headset.<br>
            3. Inside VR, <strong>Look at START</strong> to begin.
        </p>
        <button id="start-btn">ENTER VR</button>
    </div>

    <div id="reticle-left" class="reticle"></div>
    <div id="reticle-right" class="reticle"></div>

    <audio id="bg-music" loop><source src="assets/audio/bgmusic.mp3" type="audio/mpeg"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function(){const _zee=new THREE.Vector3(0,0,1),_euler=new THREE.Euler,_q0=new THREE.Quaternion,_q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));class DeviceOrientationControls{constructor(e){this.object=e,this.object.rotation.reorder("YXZ"),this.enabled=!0,this.deviceOrientation={},this.screenOrientation=0,this.alphaOffset=0,this.connect()}connect(){this.onScreenOrientationChangeEvent=()=>{this.screenOrientation=window.orientation||0},this.onDeviceOrientationChangeEvent=e=>{this.deviceOrientation=e},this.screenOrientation=window.orientation||0,window.addEventListener("orientationchange",this.onScreenOrientationChangeEvent),window.addEventListener("deviceorientation",this.onDeviceOrientationChangeEvent),this.enabled=!0}disconnect(){window.removeEventListener("orientationchange",this.onScreenOrientationChangeEvent),window.removeEventListener("deviceorientation",this.onDeviceOrientationChangeEvent),this.enabled=!1}update(){if(!1===this.enabled)return;const e=this.deviceOrientation;if(e){const t=e.alpha?THREE.MathUtils.degToRad(e.alpha)+this.alphaOffset:0,n=e.beta?THREE.MathUtils.degToRad(e.beta):0,o=e.gamma?THREE.MathUtils.degToRad(e.gamma):0,i=this.screenOrientation?THREE.MathUtils.degToRad(this.screenOrientation):0;this.setObjectQuaternion(this.object.quaternion,t,n,o,i)}}setObjectQuaternion(e,t,n,o,i){_euler.set(n,t,-o,"YXZ"),e.setFromEuler(_euler),e.multiply(_q1),e.multiply(_q0.setFromAxisAngle(_zee,-i))}}THREE.DeviceOrientationControls=DeviceOrientationControls;})();
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentLang = urlParams.get('lang') || 'en';
        
        const STORY_DATA = {
            1: { en: "Ram Rajya blossomed. Peace reigned.", hi: "राम राज्य खिल उठा। शांति का वास था।" },
            2: { en: "Hanuman stands guard over Ram.", hi: "हनुमान राम के चारों ओर एक अभेद्य किले..." },
            3: { en: "Destiny was calling... Vishnu must return.", hi: "नियति पुकार रही थी... विष्णु को लौटना होगा।" },
            4: { en: "Ram let His ring fall into the depths.", hi: "राम ने अपनी अंगूठी पाताल में गिरा दी।" },
            6: { en: "With folded hands, Hanuman bowed.", hi: "हनुमान नतमस्तक हुए।" },
            7: { en: "Vasuki: What do you seek in Naag Lok?", hi: "वासुकी: नाग लोक में क्या खोज रहे हो?" },
            8: { en: "Rings within rings... echoes of time.", hi: "अंगूठियों के भीतर अंगूठियां... समय की प्रतिध्वनि।" },
            9: { en: "Every age repeats. You always return.", hi: "हर युग दोहराता है। तुम हमेशा लौटते हो।" },
            10: { en: "He saw himself across countless lives.", hi: "उन्होंने अपने आप को अनगिनत जन्मों में देखा।" },
            11: { en: "Ram never left Hanuman's heart.", hi: "राम हनुमान के हृदय से कभी नहीं गए।" }
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02); 
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        // PARTICLES
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 4000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 120;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.12, color: 0xFFD700, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(particlesGeo, particlesMat);
        scene.add(starField);

        // PANELS
        const textureLoader = new THREE.TextureLoader();
        const panelPositions = []; 
        const PANEL_DISTANCE = 8.0; 

        function createPanel(index, zPos) {
            const group = new THREE.Group();
            group.position.set(0, 0, -zPos); 
            ['_bg.png', '_mid.png', '_fg.png'].forEach((suffix, i) => {
                const zOffsets = [-0.5, -0.2, 0.2];
                const scales = [5.5, 4.5, 3.5]; 
                const path = `assets/panels/panel${index}${suffix}`;
                textureLoader.load(path, (tex) => {
                    tex.encoding = THREE.sRGBEncoding;
                    const aspect = tex.image.width / tex.image.height;
                    const mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(aspect, 1),
                        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
                    );
                    mesh.position.z = zOffsets[i];
                    mesh.scale.set(scales[i] * 1.4, scales[i], 1);
                    group.add(mesh);
                });
            });
            worldGroup.add(group);
            panelPositions.push({ id: index, z: -zPos });
        }
        for(let i=1; i<=11; i++) createPanel(i, i * PANEL_DISTANCE);

        // --- 🔘 VISIBLE HUD 🔘 ---
        const hudGroup = new THREE.Group();
        camera.add(hudGroup);
        
        // 🔥 RAISED HIGHER (y=-0.2) so it's in view
        hudGroup.position.set(0, -0.2, -2.5); 
        hudGroup.rotation.x = -0.2; // Slight tilt up

        // START BUTTON (Center, Same Z as HUD)
        const startGroup = new THREE.Group();
        camera.add(startGroup);
        startGroup.position.set(0, 0, -2.5); 

        // SUBTITLE PLANE
        const subCanvas = document.createElement('canvas');
        subCanvas.width = 1024; subCanvas.height = 128;
        const subCtx = subCanvas.getContext('2d');
        const subTex = new THREE.CanvasTexture(subCanvas);
        const subMat = new THREE.MeshBasicMaterial({ map: subTex, transparent: true });
        const subGeo = new THREE.PlaneGeometry(3.0, 0.4);
        const subMesh = new THREE.Mesh(subGeo, subMat);
        subMesh.position.y = -0.5; // Below buttons
        hudGroup.add(subMesh);

        function updateSubtitle(text) {
            subCtx.clearRect(0,0,1024,128);
            if(!text) { subTex.needsUpdate = true; return; }
            subCtx.fillStyle = "rgba(0,0,0,0.6)";
            subCtx.roundRect(50, 10, 924, 108, 20);
            subCtx.fill();
            subCtx.fillStyle = "#FFD700";
            subCtx.font = "bold 40px Arial";
            subCtx.textAlign = "center";
            subCtx.textBaseline = "middle";
            subCtx.fillText(text, 512, 64);
            subTex.needsUpdate = true;
        }

        const buttons = {};

        function createButton(name, x, color, parentGroup) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
            const geo = new THREE.PlaneGeometry(0.35, 0.35); // Nice size
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.x = x;
            mesh.userData = { type: name };
            parentGroup.add(mesh);
            buttons[name] = { mesh, ctx, tex, color, canvas };
            drawButton(name, name); 
            return mesh;
        }

        function drawButton(name, label) {
            const btn = buttons[name];
            const ctx = btn.ctx;
            ctx.clearRect(0,0,256,256);
            ctx.fillStyle = "rgba(0,0,0,0.9)"; 
            ctx.strokeStyle = btn.color;
            ctx.lineWidth = 15;
            ctx.beginPath();
            ctx.arc(128, 128, 110, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = btn.color;
            ctx.font = "bold 60px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, 128, 128);
            btn.tex.needsUpdate = true;
        }

        createButton("REWIND", -0.5, "#FFFFFF", hudGroup);
        createButton("PLAY", 0, "#FFD700", hudGroup);
        createButton("SPEED", 0.5, "#00FF00", hudGroup);

        const btnStart = createButton("START", 0, "#00FF00", startGroup);
        btnStart.scale.set(2.5, 2.5, 2.5); // MASSIVE START BUTTON

        // LOGIC
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);
        let lookTimer = 0;
        let activeBtn = null;
        let isPlaying = false; 
        let hasStarted = false;
        let speedMultiplier = 1; 
        let moveDirection = 1; 

        function updateGaze(dt) {
            raycaster.setFromCamera(center, camera);
            const targets = [...hudGroup.children, ...startGroup.children];
            const intersects = raycaster.intersectObjects(targets);
            const retL = document.getElementById('reticle-left');
            const retR = document.getElementById('reticle-right');

            if (intersects.length > 0 && intersects[0].object.visible) {
                const hit = intersects[0].object;
                retL.classList.add('active'); retR.classList.add('active');
                if (activeBtn !== hit) { activeBtn = hit; lookTimer = 0; } 
                else {
                    lookTimer += dt;
                    const triggerTime = (hit.userData.type === "START") ? 2.0 : 1.2;
                    if (lookTimer > triggerTime) { 
                        const type = hit.userData.type;
                        if (type === "START") { hasStarted = true; isPlaying = true; startGroup.visible = false; } 
                        else if (type === "PLAY" || type === "PAUSE") {
                            isPlaying = !isPlaying;
                            drawButton("PLAY", isPlaying ? "PAUSE" : "PLAY");
                            buttons["PLAY"].mesh.userData.type = isPlaying ? "PAUSE" : "PLAY";
                        } 
                        else if (type === "SPEED") {
                            if (speedMultiplier === 1) speedMultiplier = 1.5;
                            else if (speedMultiplier === 1.5) speedMultiplier = 0.5;
                            else speedMultiplier = 1;
                            drawButton("SPEED", speedMultiplier + "x");
                        }
                        else if (type === "REWIND") {
                            moveDirection = -1; isPlaying = true;
                            drawButton("REWIND", "<<");
                            setTimeout(() => { moveDirection = 1; isPlaying = false; drawButton("PLAY", "PLAY"); buttons["PLAY"].mesh.userData.type = "PLAY"; }, 2000); 
                        }
                        retL.classList.remove('active'); retR.classList.remove('active');
                        retL.classList.add('clicked'); retR.classList.add('clicked');
                        lookTimer = 0; 
                    }
                }
            } else {
                retL.classList.remove('active'); retR.classList.remove('active');
                retL.classList.remove('clicked'); retR.classList.remove('clicked');
                activeBtn = null; lookTimer = 0;
            }
        }

        const listener = new THREE.AudioListener();
        camera.add(listener);
        const audioLoader = new THREE.AudioLoader();
        const panelAudios = {}; 
        const audioPanels = [1,2,3,4,6,7,8,9,10,11];
        audioPanels.forEach(i => {
            const sound = new THREE.Audio(listener);
            audioLoader.load(`assets/audio/panel${i}_${currentLang}.mp3`, (buffer) => {
                sound.setBuffer(buffer);
                panelAudios[i] = sound;
            });
        });

        let controls = null;
        const startBtnDOM = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        startBtnDOM.addEventListener('click', () => {
            const music = document.getElementById('bg-music');
            if(music) music.play();
            let countdown = 10;
            startBtnDOM.disabled = true;
            const timer = setInterval(() => {
                startBtnDOM.innerText = `PUT IN HEADSET... ${countdown}`;
                countdown--;
                if (countdown < 0) {
                    clearInterval(timer);
                    overlay.style.opacity = '0';
                    setTimeout(() => { overlay.style.display = 'none'; }, 1000);
                    controls = new THREE.DeviceOrientationControls(camera);
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        try { DeviceOrientationEvent.requestPermission(); } catch(e){}
                    }
                }
            }, 1000);
        });

        let currentActivePanel = -1;
        function checkProximity() {
            const camPos = new THREE.Vector3(0,0,0);
            let closestPanel = -1; let closestDist = 9999;
            panelPositions.forEach(p => {
                const panelWorldPos = new THREE.Vector3(0, 0, p.z);
                panelWorldPos.applyMatrix4(worldGroup.matrixWorld);
                const dist = camPos.distanceTo(panelWorldPos);
                if (dist < 6.0) { if (dist < closestDist) { closestDist = dist; closestPanel = p.id; } }
            });
            if (closestPanel !== -1 && closestPanel !== currentActivePanel) {
                if (currentActivePanel !== -1 && panelAudios[currentActivePanel]?.isPlaying) panelAudios[currentActivePanel].stop();
                if (panelAudios[closestPanel]) panelAudios[closestPanel].play();
                const text = STORY_DATA[closestPanel] ? STORY_DATA[closestPanel][currentLang] : "";
                updateSubtitle(text);
                currentActivePanel = closestPanel;
            }
        }

        const clock = new THREE.Clock();
        const eyeSep = 0.06;
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if(controls) controls.update();
            
            // 🔥 SPEED UP (0.04)
            if (isPlaying && hasStarted) {
                const baseSpeed = 0.04; 
                worldGroup.position.z += (baseSpeed * speedMultiplier * moveDirection);
            }
            starField.rotation.y += 0.0005;
            updateGaze(dt);
            checkProximity();

            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);
            renderer.setScissor(0, 0, w/2, h);
            renderer.setViewport(0, 0, w/2, h);
            camera.position.x = -eyeSep/2;
            renderer.render(scene, camera);
            renderer.setScissor(w/2, 0, w/2, h);
            renderer.setViewport(w/2, 0, w/2, h);
            camera.position.x = eyeSep/2;
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
