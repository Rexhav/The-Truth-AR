<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Truth - Scroll Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background-color: #050505; 
            font-family: 'Cinzel', serif; 
            color: #FFD700;
            overflow-x: hidden;
        }

        /* CONTAINER */
        .story-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* PANEL STYLING */
        .panel {
            position: relative;
            width: 100%;
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
        }

        /* IMAGE HANDLING - THE FIX */
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 🔥 ENSURES NO CROPPING ON MOBILE */
            display: block;
        }
        
        /* DESKTOP TWEAK: Keep it cleaner on wide screens */
        @media (min-width: 768px) {
            .panel img {
                object-fit: cover; /* On desktop, full bleed looks better */
                max-width: 800px;  /* Limit width so it doesn't get too tall */
                margin: 0 auto;
                height: auto;
                border: 1px solid #333;
            }
            .panel { height: auto; padding: 50px 0; }
        }

        /* AUDIO PLAYER */
        #audio-controls {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.7); border: 1px solid #FFD700;
            padding: 10px; border-radius: 50%; width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 100;
        }

        /* HOME BUTTON */
        #home-btn {
            position: fixed; top: 20px; left: 20px;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.3); z-index: 100;
        }
    </style>
</head>
