<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Truth - Scroll Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background-color: #050505; 
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers the content on Desktop */
        }

        /* The Frame for the Art */
        .panel {
            position: relative;
            width: 100%;
            height: 100vh; /* Default to full screen height */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid #222;
        }

        /* THE LAYER FIX */
        .layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; /* Default for Desktop (Fills the box) */
        }

        /* --- 📱 MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .layer {
                object-fit: contain; /* Ensures FULL art is seen on phone */
            }
            .panel {
                height: 100vh; /* Force full height on mobile */
                background: #000; /* Black bars if ratio differs */
            }
        }

        /* --- 🖥️ DESKTOP OPTIMIZATION --- */
        @media (min-width: 769px) {
            .panel {
                width: 100%; 
                max-width: 600px; /* Limits width so it doesn't stretch weirdly */
                height: 90vh; /* Slightly smaller than full screen for scroll feel */
                margin: 20px 0;
                box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
            }
            .layer {
                object-fit: cover; 
            }
        }

        #home-btn {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.6); padding: 10px; border-radius: 50%;
            border: 1px solid #FFD700; cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" id="home-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFD700" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
    </a>

    <div id="container">
        </div>

    <script>
        const container = document.getElementById('container');
        const TOTAL_PANELS = 11;

        for (let i = 1; i <= TOTAL_PANELS; i++) {
            if (i === 5) continue; // Skip empty panel

            const panelDiv = document.createElement('div');
            panelDiv.className = 'panel';
            
            // Stack Layers: BG -> MID -> FG
            ['bg', 'mid', 'fg'].forEach(layer => {
                const img = document.createElement('img');
                img.src = `assets/panels/panel${i}_${layer}.png`;
                img.className = `layer ${layer}`;
                panelDiv.appendChild(img);
            });

            container.appendChild(panelDiv);
        }
    </script>
</body>
</html>
