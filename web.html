<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Truth - Hanuman</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@1,400&family=Rozha+One&display=swap" rel="stylesheet">
    
    <style>
        /* ADDED: LANDSCAPE ALERT */
        #landscape-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; color: #FFD700; font-family: 'Cinzel', serif;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #landscape-alert svg { width: 60px; height: 60px; fill: #FFD700; margin-bottom: 20px; animation: rotate 2s infinite; }
        
        /* Only show on phones in portrait mode */
        @media only screen and (max-width: 768px) and (orientation: portrait) {
            #landscape-alert { display: flex; }
        }
        @keyframes rotate { 0% { transform: rotate(0deg); } 25% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="landscape-alert">
        <svg viewBox="0 0 24 24"><path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3.25-3H6.75V4h10.5v14z"/></svg>
        <p>PLEASE ROTATE PHONE</p>
        <p style="font-size: 0.8rem; opacity: 0.7; margin-top:10px;">For the best cinematic experience</p>
    </div>

    <div id="loading-screen">
        <div class="loader-content">
            <h1>Loading The Truth...</h1>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <button id="enter-btn">Begin Journey</button>
        </div>
    </div>

    <div id="scroll-indicator">
        <p>↓ SCROLL DOWN ↓</p>
    </div>

    <div id="subtitle-container">
        <div id="subtitle-text"></div>
    </div>

    <audio id="bg-music-player" loop preload="auto">
        <source src="assets/audio/bgmusic.mp3" type="audio/mpeg">
    </audio> 

   <script type="module" src="script-web.js"></script>

</body>
</html>
